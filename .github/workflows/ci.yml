name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: JavaScript (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxe dos módulos ES
        run: |
          fail=0
          for f in js/*.js js/panels/*.js js/meteo/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail
      - run: npm test

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      - name: Testes (sem rede)
        run: python -m pytest tests/ -q -m "not network"
