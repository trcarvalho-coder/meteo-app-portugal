name: Precompute Open-Meteo (ECMWF 15 dias)

# Pre-computa as camadas geograficas derivadas da API Open-Meteo (modelo
# ECMWF ecmwf_ifs025, open-data, sem custos e sem chave) para o Atlantico
# Norte (oeste -100 ate este 16E) e publica JSON estatico em data/om/ servido
# pelo GitHub Pages.
#
# Atualizacao 2x por dia (acao pedida): 06:30 e 18:30 UTC, apos a publicacao
# das execucoes 00z/12z do ECMWF pela Open-Meteo (o modelo corre de 6 em 6 h
# e a API disponibiliza a previsao completa ate 15 dias em qualquer instante).
#
# Temporalidade: passos de 3 h ate 72 h; 6 h apos 72 h, ate 360 h (15 dias).

on:
  schedule:
    - cron: "30 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precompute-om
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    # A grelha da AOI tem ~33 785 pontos; a 500 pontos/pedido (limite da API:
    # ate 1000 coordenadas por pedido) sao ~68 pedidos por execucao.
    # O IP do runner GitHub e partilhado e a Open-Meteo aplica rate limit por
    # IP (429): dai o throttle de 3 s, o retry com Retry-After e a cache de
    # lotes (recuperada de corridas anteriores, TTL 24 h).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache de lotes Open-Meteo (mitiga 429 do rate limit por IP)
        uses: actions/cache@v4
        with:
          path: /tmp/om-cache
          key: om-batch-${{ github.run_number }}
          restore-keys: |
            om-batch-

      - name: Pre-computar camadas Open-Meteo (15 dias, 3h/6h)
        env:
          METEO_OM_CACHE_DIR: /tmp/om-cache
          METEO_OM_CACHE_TTL: "86400"
        run: python backend/precompute_om.py

      - name: Validar indice e ficheiros antes do commit
        run: |
          python - <<'EOF'
          import json, os
          with open("data/om/latest.json", encoding="utf-8") as fh:
              idx = json.load(fh)
          assert idx["model"] == "ecmwf_ifs025", idx.get("model")
          assert idx["maxStep"] == 360, f"maxStep != 360: {idx.get('maxStep')}"
          steps = idx["steps"]
          assert steps[:25] == list(range(0, 73, 3)), "passos 0..72 h de 3 em 3 h"
          assert all(s % 6 == 0 for s in steps[25:]), "apos 72 h, passos de 6 h"
          assert steps[-1] == 360, f"ultimo passo {steps[-1]} != 360"
          assert len(steps) == 73, f"{len(steps)} passos (esperado 73)"
          run_id = idx["run"].replace("/", "")
          layers = idx["layers"]
          for step in steps:
              for layer in layers:
                  path = f"data/om/{run_id}/{layer}-{step}h.json"
                  assert os.path.exists(path), f"falta {path}"
                  with open(path, encoding="utf-8") as fh:
                      f = json.load(fh)
                  assert f.get("values") is not None, f"sem valores em {path}"
                  assert f["lats"] and f["lons"], f"sem grelha em {path}"
          print(f"OK: {run_id} — 73 passos x {len(layers)} camadas validados (maxStep 360 h)")
          EOF

      # Mantem apenas a execucao atual e a anterior (limite do Pages)
      - name: Limpar execucoes antigas
        run: |
          ls -1d data/om/*/ | sort | head -n -2 | xargs -r rm -rf

      - name: Publicar dados no repositorio (servidos pelo Pages)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: camadas Open-Meteo ECMWF 15 dias pre-computadas (auto)"
          file_pattern: data/om/*.json data/om/**/*.json
