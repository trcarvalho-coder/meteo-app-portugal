<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Portugal — Previsão e Histórico</title>
    <!-- ArcGIS 5.1.26 (Esri) -->
    <link rel="stylesheet" href="https://js.arcgis.com/5.1.26/@arcgis/core/themes/light/main.css">
    <script type="module">
        import Map from "https://js.arcgis.com/5.1.26/@arcgis/core/Map.js";
        import MapView from "https://js.arcgis.com/5.1.26/@arcgis/core/views/MapView.js";
        import GraphicsLayer from "https://js.arcgis.com/5.1.26/@arcgis/core/layers/GraphicsLayer.js";
        import Point from "https://js.arcgis.com/5.1.26/@arcgis/core/geometry/Point.js";
        import SimpleMarkerSymbol from "https://js.arcgis.com/5.1.26/@arcgis/core/symbols/SimpleMarkerSymbol.js";
        import TextSymbol from "https://js.arcgis.com/5.1.26/@arcgis/core/symbols/TextSymbol.js";
        import Graphic from "https://js.arcgis.com/5.1.26/@arcgis/core/Graphic.js";
        import Popup from "https://js.arcgis.com/5.1.26/@arcgis/core/widgets/Popup.js";
        window.arcgis = { Map, MapView, GraphicsLayer, Point, SimpleMarkerSymbol, TextSymbol, Graphic, Popup };
    </script>
    <!-- URL do backend ECMWF em produção (ver docs/deploy-backend.md) -->
    <script>window.ECMWF_BACKEND_URL = window.ECMWF_BACKEND_URL || 'http://127.0.0.1:8787';</script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="windy-container">
        <!-- Mapa principal -->
        <div id="map-view" class="windy-map" role="application" aria-label="Mapa meteorológico de Portugal"></div>

        <!-- ===== RAIL DE BOTÕES COMPACTOS (direita) ===== -->
        <nav class="widget-rail" id="widget-rail" aria-label="Painéis">
            <button class="rail-btn" data-panel="openmeteo" aria-expanded="false" aria-controls="floating-panel" title="Estado atual (Open-Meteo)">
                <i class="fas fa-temperature-half" aria-hidden="true"></i><span>Atual</span>
            </button>
            <button class="rail-btn" data-panel="omforecast" aria-expanded="false" aria-controls="floating-panel" title="Previsão Open-Meteo">
                <i class="fas fa-cloud-sun-rain" aria-hidden="true"></i><span>Previsão OM</span>
            </button>
            <button class="rail-btn" data-panel="ecmwf" aria-expanded="false" aria-controls="floating-panel" title="Previsão ECMWF 7 dias">
                <i class="fas fa-satellite-dish" aria-hidden="true"></i><span>ECMWF</span>
            </button>
            <button class="rail-btn" data-panel="ipma" aria-expanded="false" aria-controls="floating-panel" title="Avisos IPMA">
                <i class="fas fa-triangle-exclamation" aria-hidden="true"></i><span>Avisos</span>
                <span id="rail-alerts-badge" class="badge" hidden>0</span>
            </button>
            <button class="rail-btn" data-panel="stations" aria-expanded="false" aria-controls="floating-panel" title="Estações IPMA">
                <i class="fas fa-tower-observation" aria-hidden="true"></i><span>Estações</span>
            </button>
            <button class="rail-btn" data-panel="era5" aria-expanded="false" aria-controls="floating-panel" title="ERA5 — Histórico">
                <i class="fas fa-clock-rotate-left" aria-hidden="true"></i><span>ERA5</span>
            </button>
            <button class="rail-btn" data-panel="location" aria-expanded="false" aria-controls="floating-panel" title="Localização">
                <i class="fas fa-location-dot" aria-hidden="true"></i><span>Local</span>
            </button>
            <div class="rail-sep" role="separator"></div>
            <button class="rail-btn" id="rail-toggle-warnings" title="Mostrar/ocultar camada Avisos IPMA" aria-pressed="true">
                <i class="fas fa-layer-group" aria-hidden="true"></i><span>Avisos ON</span>
            </button>
            <button class="rail-btn" id="rail-toggle-stations" title="Mostrar/ocultar camada Estações IPMA" aria-pressed="true">
                <i class="fas fa-diagram-project" aria-hidden="true"></i><span>Estações ON</span>
            </button>
        </nav>

        <!-- ===== PAINEL FLUTUANTE ÚNICO (aberto pelo rail) ===== -->
        <div class="floating-panel" id="floating-panel" hidden></div>

        <!-- Conteúdo dos painéis (movido para templates) -->
        <div hidden id="panel-templates">

            <!-- Widget: Condições Atuais (Open-Meteo) -->
            <template id="tpl-openmeteo"><div id="openmeteo-panel" class="widget-body">
                <div id="openmeteo-panel-content" class="widget-content">
                    <div id="openmeteo-loading" class="loading-spinner" hidden>
                        <div class="spinner" role="status" aria-label="A carregar"></div>
                        <p>A carregar dados Open-Meteo…</p>
                    </div>
                    <div class="widget-section">
                        <h3>Condições atuais</h3>
                        <div id="openmeteo-current-data" class="weather-grid"></div>
                    </div>
                    <div class="widget-section">
                        <h3>Próximas 24 horas</h3>
                        <div id="openmeteo-hourly-data" class="hourly-scroll" tabindex="0" aria-label="Previsão horária, lista navegável horizontalmente"></div>
                    </div>
                    <div class="widget-section">
                        <h3>Previsão diária</h3>
                        <div id="openmeteo-daily-3-data" class="daily-scroll"></div>
                        <div id="openmeteo-daily-5-data" class="daily-scroll"></div>
                        <div id="openmeteo-daily-7-data" class="daily-scroll"></div>
                    </div>
                </div>
            </div></template>

            <!-- Widget: ECMWF — Previsão 7 dias -->
            <template id="tpl-ecmwf"><div id="ecmwf-panel" class="widget-body">
                <div id="ecmwf-panel-content" class="widget-content">
                    <div id="ecmwf-loading" class="loading-spinner" hidden>
                        <div class="spinner" role="status" aria-label="A carregar"></div>
                        <p>A carregar camadas ECMWF…</p>
                    </div>
                    <div id="ecmwf-error" class="widget-error" hidden>
                        <p id="ecmwf-error-message" role="alert"></p>
                        <button id="ecmwf-retry" class="btn-retry"><i class="fas fa-rotate-right" aria-hidden="true"></i> Tentar novamente</button>
                    </div>
                    <div class="widget-section">
                        <label for="ecmwf-variable">Variável</label>
                        <select id="ecmwf-variable" class="form-select" aria-label="Variável meteorológica">
                            <option value="temperature" selected>Temperatura a 2 m (°C)</option>
                            <option value="windSpeed">Vento a 10 m (km/h)</option>
                            <option value="precipitation">Precipitação no intervalo (mm)</option>
                        </select>
                        <p id="ecmwf-variable-meta" class="widget-meta" aria-live="polite"></p>
                    </div>
                    <div class="widget-section">
                        <h3>Execução do modelo</h3>
                        <p id="ecmwf-run-info" class="widget-meta" aria-live="polite">A determinar execução…</p>
                    </div>
                    <div class="widget-section">
                        <label for="ecmwf-layer-opacity">Opacidade da camada</label>
                        <input type="range" id="ecmwf-layer-opacity" min="0" max="100" value="70"
                            aria-label="Opacidade da camada no mapa">
                    </div>
                </div>
            </div></template>

            <!-- Widget: ERA5 — Histórico (integração pendente) -->
            <template id="tpl-era5"><div id="era5-panel" class="widget-body">
                <div id="era5-panel-content" class="widget-content">
                    <div class="widget-meta" id="era5-source" aria-live="polite">
                        Open-Meteo Historical API — ERA5 (reanálise, 0.25°, desde 1940).
                        Fonte interina identificada; integração ARCO-ERA5/BigQuery pendente.
                        ERA5 é uma <strong>reanálise histórica</strong>, não previsão.
                    </div>
                    <div class="widget-section">
                        <div class="era5-date-row">
                            <label for="era5-start-date">Início</label>
                            <input type="text" id="era5-start-date" class="era5-date-input" aria-label="Data inicial do histórico (AAAA-MM-DD)">
                            <label for="era5-end-date">Fim</label>
                            <input type="text" id="era5-end-date" class="era5-date-input" aria-label="Data final do histórico (AAAA-MM-DD)">
                            <button id="era5-search-btn" class="btn-icon" title="Consultar histórico" aria-label="Consultar histórico">
                                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div id="era5-loading" class="loading-spinner" hidden>
                        <div class="spinner" role="status" aria-label="A carregar"></div>
                        <p>A carregar histórico ERA5…</p>
                    </div>
                    <div id="era5-error" class="widget-error" hidden>
                        <p id="era5-error-message" role="alert"></p>
                        <button id="era5-retry" class="btn-retry"><i class="fas fa-rotate-right" aria-hidden="true"></i> Tentar novamente</button>
                    </div>
                    <div id="era5-results" class="widget-section" aria-live="polite"></div>
                </div>
            </div></template>

            <!-- Widget: Alertas IPMA -->
            <template id="tpl-ipma"><div id="ipma-panel" class="widget-body">
                <div id="ipma-panel-content" class="widget-content">
                    <div id="ipma-loading" class="loading-spinner" hidden>
                        <div class="spinner" role="status" aria-label="A carregar"></div>
                        <p>A carregar alertas IPMA…</p>
                    </div>
                    <div class="widget-section">
                        <label class="visually-hidden" for="ipma-district-filter">Filtrar por distrito</label>
                        <select id="ipma-district-filter" class="form-select">
                            <option value="">Todos os distritos</option>
                        </select>
                    </div>
                    <div id="ipma-alerts-data" class="alerts-scroll" aria-live="polite"></div>
                    <div class="widget-section">
                        <h3>Previsão IPMA</h3>
                        <label class="visually-hidden" for="ipma-forecast-days">Dias de previsão</label>
                        <select id="ipma-forecast-days" class="form-select">
                            <option value="1">Hoje</option>
                            <option value="3" selected>3 dias</option>
                            <option value="5">5 dias</option>
                            <option value="7">7 dias</option>
                        </select>
                        <div id="ipma-forecast-data" class="daily-scroll"></div>
                    </div>
                </div>
            </div></template>

            <!-- Widget: Localização -->
            <template id="tpl-omforecast"><div id="omforecast-panel" class="widget-body">
                    <p id="omf-location" class="widget-meta" aria-live="polite">--</p>
                    <p id="omf-updated" class="widget-meta">Fonte: Open-Meteo (previsão — não é observação)</p>
                    <div class="widget-section">
                        <label for="omf-variable">Variável</label>
                        <select id="omf-variable" class="form-select" aria-label="Variável da previsão">
                            <option value="temperature" selected>Temperatura (°C)</option>
                            <option value="wind">Vento e rajadas (km/h)</option>
                            <option value="precipitation">Precipitação (mm / prob.)</option>
                        </select>
                    </div>
                    <div id="omf-loading" class="loading-spinner" hidden>
                        <div class="spinner" role="status" aria-label="A carregar"></div>
                        <p>A carregar previsão Open-Meteo…</p>
                    </div>
                    <div id="omf-error" class="widget-error" hidden>
                        <p id="omf-error-message" role="alert"></p>
                        <button id="omf-retry" class="btn-retry"><i class="fas fa-rotate-right" aria-hidden="true"></i> Tentar novamente</button>
                    </div>
                    <div class="widget-section">
                        <h3>Próximas horas</h3>
                        <div id="omf-hourly-table"></div>
                    </div>
                    <div class="widget-section">
                        <h3>7 dias</h3>
                        <div id="omf-daily-table"></div>
                    </div>
                </div></template>
                        <template id="tpl-stations"><div id="stations-panel" class="widget-body">
                    <p class="widget-meta">Catálogo público de estações meteorológicas do IPMA (continente, Madeira e Açores), com a última observação válida disponível. A simbologia usa apenas dados reais: temperatura e/ou vento observados; sem ícones de estado do tempo inventados.</p>
                    <div class="widget-section">
                        <h3>Legenda</h3>
                        <div class="ipma-pop-row"><span>● azul com valor</span><strong>temperatura observada (°C)</strong></div>
                        <div class="ipma-pop-row"><span>● cinzento</span><strong>sem dados recentes</strong></div>
                        <div class="ipma-pop-row"><span>● âmbar</span><strong>dados desatualizados</strong></div>
                    </div>
                    <div class="widget-section">
                        <h3>Estado</h3>
                        <p id="stations-status" class="widget-meta" aria-live="polite">A carregar…</p>
                    </div>
                </div></template>
            <template id="tpl-location"><div id="location-panel" class="widget-body">
                <div id="location-panel-content" class="widget-content">
                    <div class="location-search-row">
                        <label class="visually-hidden" for="location-search-input">Pesquisar cidade ou coordenadas</label>
                        <input type="search" id="location-search-input" placeholder="Cidade ou lat, lng…">
                        <button id="location-search-btn" class="btn-icon" title="Pesquisar" aria-label="Pesquisar localização">
                            <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="location-info">
                        <p><strong>Lat:</strong> <span id="location-lat-display">--</span></p>
                        <p><strong>Lng:</strong> <span id="location-lng-display">--</span></p>
                        <p><strong>Local:</strong> <span id="location-name-display">--</span></p>
                    </div>
                    <div class="location-buttons">
                        <button id="location-gps-btn" class="btn-secondary">
                            <i class="fas fa-location-arrow" aria-hidden="true"></i> Usar a minha localização
                        </button>
                        <button id="location-map-select-btn" class="btn-secondary">
                            <i class="fas fa-crosshairs" aria-hidden="true"></i> Selecionar no mapa
                        </button>
                        <button id="location-clear-selection-btn" class="btn-secondary" hidden>
                            <i class="fas fa-times" aria-hidden="true"></i> Limpar seleção
                        </button>
                    </div>
                </div>
            </div></template>
        </div>

        <!-- ===== LINHA TEMPORAL TRI-HORÁRIA (previsão) ===== -->
        <div class="timeline-panel" id="timeline-panel" role="region" aria-label="Linha temporal de previsão">
            <div class="timeline-controls">
                <button id="tl-prev" class="btn-icon" title="Recuar 3 horas" aria-label="Recuar 3 horas">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <button id="tl-play" class="btn-icon" title="Reproduzir/Pausar animação" aria-label="Reproduzir ou pausar animação" aria-pressed="false">
                    <i class="fas fa-play" aria-hidden="true" id="tl-play-icon"></i>
                </button>
                <button id="tl-next" class="btn-icon" title="Avançar 3 horas" aria-label="Avançar 3 horas">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
                <input type="range" id="tl-range" min="0" max="56" value="0" step="1"
                    class="timeline-range" aria-label="Instante de previsão">
                <output id="tl-datetime" class="timeline-datetime" for="tl-range">--</output>
                <label class="visually-hidden" for="tl-speed">Velocidade da animação</label>
                <select id="tl-speed" class="form-select timeline-speed" aria-label="Velocidade da animação">
                    <option value="2000">Lenta</option>
                    <option value="1000" selected>Normal</option>
                    <option value="500">Rápida</option>
                </select>
                <label class="tl-loop-label"><input type="checkbox" id="tl-loop" checked> Repetir</label>
                <label class="visually-hidden" for="tl-timezone">Fuso horário</label>
                <select id="tl-timezone" class="form-select timeline-speed" aria-label="Fuso horário">
                    <option value="Europe/Lisbon" selected>Europe/Lisbon</option>
                    <option value="Atlantic/Azores">Atlantic/Azores</option>
                    <option value="UTC">UTC</option>
                </select>
            </div>
            <div id="tl-step-info" class="timeline-step-info" aria-live="polite"></div>
        </div>

        <!-- Tooltip de hover (avisos IPMA) -->
        <div id="ipma-hover-tooltip" class="ipma-hover-tooltip" role="tooltip" style="display:none"></div>

        <!-- Legenda da camada ativa -->
        <div class="legend-panel" id="legend-panel" hidden>
            <h3 id="legend-title">Legenda</h3>
            <div id="legend-bar" class="legend-bar"></div>
            <div id="legend-labels" class="legend-labels"></div>
            <p id="legend-meta" class="widget-meta"></p>
        </div>

        <!-- Basemaps -->
        <div class="basemap-panel" role="toolbar" aria-label="Selecionar mapa base">
            <button id="basemap-streets" class="basemap-btn active" data-basemap="topo-vector" title="Mapa topográfico">
                <i class="fas fa-map" aria-hidden="true"></i>
            </button>
            <button id="basemap-satellite" class="basemap-btn" data-basemap="satellite" title="Satélite">
                <i class="fas fa-satellite" aria-hidden="true"></i>
            </button>
            <button id="basemap-terrain" class="basemap-btn" data-basemap="terrain" title="Terreno">
                <i class="fas fa-mountain" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Atribuições e licenças -->
        <div class="attribution-panel">
            <div class="data-sources">
                <span>Mapas: <strong>Esri</strong></span>
                <span>Previsão 7 dias: <strong>ECMWF Open Data (AWS)</strong> — CC-BY-4.0</span>
                <span>Alertas: <strong>IPMA</strong></span>
                <span>Atual/rajadas: <strong>Open-Meteo</strong> — uso não comercial, &lt;10 000 chamadas/dia</span>
                <span>Histórico: <strong>ERA5 via Open-Meteo</strong> (ARCO-ERA5/BigQuery pendente)</span>
            </div>
        </div>
    </div>

    <!-- Módulos -->
    <script type="module" src="js/index.js"></script>
</body>
</html>
