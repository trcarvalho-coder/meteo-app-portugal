<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Portugal - Windy Style</title>

    <!-- ArcGIS 5.1.26 -->
    <script type="module">
        import Map from "https://js.arcgis.com/5.1.26/@arcgis/core/Map.js";
        import MapView from "https://js.arcgis.com/5.1.26/@arcgis/core/views/MapView.js";
        import GraphicsLayer from "https://js.arcgis.com/5.1.26/@arcgis/core/layers/GraphicsLayer.js";
        import Point from "https://js.arcgis.com/5.1.26/@arcgis/core/geometry/Point.js";
        import SimpleMarkerSymbol from "https://js.arcgis.com/5.1.26/@arcgis/core/symbols/SimpleMarkerSymbol.js";
        import TextSymbol from "https://js.arcgis.com/5.1.26/@arcgis/core/symbols/TextSymbol.js";
        import Graphic from "https://js.arcgis.com/5.1.26/@arcgis/core/Graphic.js";
        window.arcgis = { Map, MapView, GraphicsLayer, Point, SimpleMarkerSymbol, TextSymbol, Graphic };
    </script>

    <!-- CSS Moderno (Windy Style) -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Material+Icons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Container Principal -->
    <div class="windy-container">
        <!-- Mapa (sempre visível) -->
        <div id="map-view" class="windy-map"></div>

        <!-- Painel de Controle (lado esquerdo) -->
        <div class="windy-control-panel">
            <div class="panel-header">
                <h1>⛅ Meteo Portugal</h1>
                <p class="subtitle">Previsão em Tempo Real</p>
            </div>

            <!-- Botões Principais -->
            <div class="main-buttons">
                <button id="btn-current" class="control-btn active" data-panel="current" title="Condições Atuais">
                    <i class="fas fa-thermometer-half"></i>
                    <span>Atual</span>
                </button>
                <button id="btn-alerts" class="control-btn" data-panel="alerts" title="Alertas Meteorológicos">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Alertas</span>
                    <span id="alerts-badge" class="badge">0</span>
                </button>
                <button id="btn-forecast" class="control-btn" data-panel="forecast" title="Previsão">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Previsão</span>
                </button>
                <button id="btn-location" class="control-btn" data-panel="location" title="Localização">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Local</span>
                </button>
            </div>

            <!-- Painéis de Informação (aparecem ao clicar nos botões) -->
            <div class="info-panels">
                <!-- Painel de Condições Atuais -->
                <div id="panel-current" class="info-panel active">
                    <div class="panel-content">
                        <div class="current-weather">
                            <div class="weather-main">
                                <div class="weather-icon-large" id="current-weather-icon">🌦️</div>
                                <div class="weather-temp">
                                    <span id="current-temp">--</span>°C
                                </div>
                                <div class="weather-description" id="current-desc">A carregar...</div>
                            </div>
                            <div class="weather-details">
                                <div class="detail-row">
                                    <div class="detail-item">
                                        <i class="fas fa-tint"></i>
                                        <span>Humidade: <strong id="current-humidity">--</strong>%</span>
                                    </div>
                                    <div class="detail-item">
                                        <i class="fas fa-wind"></i>
                                        <span>Vento: <strong id="current-wind">--</strong> km/h</span>
                                    </div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-item">
                                        <i class="fas fa-compass"></i>
                                        <span>Direção: <strong id="current-direction">--</strong></span>
                                    </div>
                                    <div class="detail-item">
                                        <i class="fas fa-cloud-rain"></i>
                                        <span>Precip: <strong id="current-precip">--</strong> mm</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Painel de Alertas -->
                <div id="panel-alerts" class="info-panel">
                    <div class="panel-header-small">
                        <h2>⚠️ Alertas IPMA</h2>
                        <div class="alert-filters">
                            <select id="alert-district" class="form-select">
                                <option value="">Todos os Distritos</option>
                            </select>
                        </div>
                    </div>
                    <div id="alerts-container" class="alerts-scroll">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p>A carregar alertas do IPMA...</p>
                        </div>
                    </div>
                </div>

                <!-- Painel de Previsão -->
                <div id="panel-forecast" class="info-panel">
                    <div class="panel-header-small">
                        <h2>📅 Previsão</h2>
                        <div class="forecast-filters">
                            <select id="forecast-days" class="form-select">
                                <option value="1">Hoje</option>
                                <option value="3" selected>3 Dias</option>
                                <option value="5">5 Dias</option>
                                <option value="7">7 Dias</option>
                            </select>
                        </div>
                    </div>
                    <div id="forecast-container" class="forecast-scroll">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p>A carregar previsão...</p>
                        </div>
                    </div>
                </div>

                <!-- Painel de Localização -->
                <div id="panel-location" class="info-panel">
                    <div class="panel-header-small">
                        <h2>📍 Localização</h2>
                    </div>
                    <div class="location-content">
                        <div class="location-search">
                            <input type="text" id="location-search" placeholder="Pesquisar cidade ou coordenadas...">
                            <button id="search-btn" class="btn-search"><i class="fas fa-search"></i></button>
                        </div>
                        <div class="location-info">
                            <p><strong>Lat:</strong> <span id="location-lat">--</span></p>
                            <p><strong>Lng:</strong> <span id="location-lng">--</span></p>
                            <p><strong>Local:</strong> <span id="location-name">--</span></p>
                        </div>
                        <button id="btn-gps" class="btn-gps">
                            <i class="fas fa-location-arrow"></i> Usar Minha Localização
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Painel de Basemaps (canto superior direito) -->
        <div class="basemap-panel">
            <button id="basemap-streets" class="basemap-btn active" data-basemap="topo-vector" title="Mapa Topográfico">
                <i class="fas fa-map"></i>
            </button>
            <button id="basemap-satellite" class="basemap-btn" data-basemap="satellite" title="Satélite">
                <i class="fas fa-satellite"></i>
            </button>
            <button id="basemap-terrain" class="basemap-btn" data-basemap="terrain" title="Terreno">
                <i class="fas fa-mountain"></i>
            </button>
        </div>

        <!-- Painel de Atribuição (canto inferior direito) -->
        <div class="attribution-panel">
            <div class="data-sources">
                <span>🌍 <strong>Mapas:</strong> Esri</span>
                <span>⚠️ <strong>Alertas:</strong> IPMA</span>
                <span>🌦️ <strong>Dados:</strong> OpenMeteo</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/map.js"></script>
    <script type="module" src="js/ipma-api.js"></script>
    <script type="module" src="js/openmeteo-api.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
